{% extends 'base/base.html' %}

{% block body %}
  <div class="main-section">
    <div class="page-section nopadding cs-nomargin" style="margin-top: 0px;padding-top: 30px;padding-bottom: 60px;margin-bottom: 0px;">
      <div class="container">
        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="user-dashboard loader-holder" style="width: 70%;">
              <div class="user-holder">
                <h4 class="text-center" style="margin-bottom: 0;">LOGIN</h4>
                <hr />
                <div id="restaurant-sets-holder">
                  <form class="form-fields-set foodbakery-dev-restaurant-form" method="post" action="{% url 'accounts:login' %}">
                    <div class="row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="row">
                            {%if error%}
                            <p class="btn-next-restaurant-information white">{{error}}</p>
                            {%endif%}
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <label>Email</label>
                              <input type="email" name="email" placeholder="Your Email Address" />
                            </div>
                          </div>
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <label>Password</label>
                              <input type="password" name="password" placeholder="Your Passowrd" />
                            </div>
                          </div>
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <div class="payment-holder">
                                <input type="submit" value="Login" id="btn-next-restaurant-information white" class="bgcolor" />
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <input type="hidden" name="next" value="{{next}}">
                    {% csrf_token %}
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Section End -->
{% endblock %}
