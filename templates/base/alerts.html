{% if messages %}
  <div class="container container-lg">
    {% for m in messages %}
      <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
        <span class="font-medium">Error!</span> {{ m|safe }}
      </div>
    {% endfor %}
  </div>
{% endif %}
