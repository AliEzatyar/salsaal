{% extends "admin/base_site.html" %}
{% block content %}
<h1>Customer Tracking</h1>
<div>
  <label>Period:
    <select id="period">
      <option value="month">This Month</option>
      <option value="week">Last 7 days</option>
      <option value="day">Today</option>
      <option value="custom">Custom</option>
    </select>
  </label>
  <span id="custom-range" style="display:none;">
    From: <input type="date" id="start_date">
    To: <input type="date" id="end_date">
  </span>
  <label style="margin-left:16px;">Limit:
    <input type="number" id="limit" min="1" max="1000" value="20" style="width:60px;">
  </label>
  <button id="refresh">Refresh</button>
</div>

<style>
.table-section {
  margin-bottom: 18px;
  border-radius: 8px;
  overflow: hidden;
}
.table-section .table-scroll {
  width: 100%;
  overflow-x: auto;
}
.table-section table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  font-size: 15px;
}
.table-section th, .table-section td {
  padding: 8px 6px;
  text-align: left;
  word-break: break-all;
}
.table-section th {
  font-weight: bold;
}
#top_customers_section { background: #e3f2fd; }
#top_processed_section { background: #e8f5e9; }
#top_cancelled_section { background: #fff3e0; }
#customers_section { background: #f3e5f5; }
@media (max-width: 600px) {
  .table-section table {
    font-size: 13px;
    min-width: 500px;
  }
  .table-section th, .table-section td {
    padding: 6px 2px;
  }
  /* No block display, keep table layout for horizontal scroll */
}
.collapse-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #1976d2;
  color: #fff;
  border: none;
  padding: 10px 12px;
  font-size: 16px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  margin-bottom: 0;
}
.collapse-btn.collapsed {
  background: #757575;
}
.whatsapp-link {
  color: #25d366;
  font-weight: bold;
  text-decoration: none;
}
.table-section tr[data-whatsapp] {
  cursor: pointer;
  transition: background 0.12s;
}
.table-section tr[data-whatsapp]:hover {
  background: #e0f7fa !important;
}
</style>

<div class="table-section" id="customers_section">
  <button class="collapse-btn" onclick="toggleTable('customers')">Customers</button>
  <div id="customers_wrapper" style="display:none;">
    <div class="table-scroll"><table id="customers"></table></div>
  </div>
</div>
<div class="table-section" id="top_processed_section">
  <button class="collapse-btn" onclick="toggleTable('top_processed')">Top Processed (delivered)</button>
  <div id="top_processed_wrapper" style="display:none;">
    <div class="table-scroll"><table id="top_processed"></table></div>
  </div>
</div>
<div class="table-section" id="top_customers_section">
  <button class="collapse-btn" onclick="toggleTable('top_customers')">Top Customers (by orders)</button>
  <div id="top_customers_wrapper" style="display:none;">
    <div class="table-scroll"><table id="top_customers"></table></div>
  </div>
</div>
<div class="table-section" id="top_cancelled_section">
  <button class="collapse-btn" onclick="toggleTable('top_cancelled')">Top Cancelled</button>
  <div id="top_cancelled_wrapper" style="display:none;">
    <div class="table-scroll"><table id="top_cancelled"></table></div>
  </div>
</div>

<script>
function toggleTable(tableId) {
  // Toggle selected table, allow all to be closed
  ['top_customers','top_processed','top_cancelled','customers'].forEach(function(id){
    const wrapper = document.getElementById(id+'_wrapper');
    const btn = document.querySelector('#'+id+'_section .collapse-btn');
    if (id === tableId) {
      // Toggle: open if closed, close if open
      if (wrapper.style.display === 'block') {
        wrapper.style.display = 'none';
        btn.classList.remove('collapsed');
      } else {
        wrapper.style.display = 'block';
        btn.classList.add('collapsed');
      }
    } else {
      // Leave others unchanged
    }
  });
}

function renderTable(elId, rows, headers) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; tr.appendChild(th); });
  thead.appendChild(tr);
  el.appendChild(thead);
  const tbody = document.createElement('tbody');
  // Sort by loyalty_score descending for customers table
  let sortedRows = rows;
  if (elId === 'customers') {
    sortedRows = [...rows].filter(r => !(r['payment_type'] && r['payment_type'] === 'qoraa_payment'))
      .sort((a, b) => (b.loyalty_score || 0) - (a.loyalty_score || 0));
  } else {
    sortedRows = rows.filter(r => !(r['payment_type'] && r['payment_type'] === 'qoraa_payment'));
  }
  sortedRows.forEach(r => {
    let phone = r['phone_number'] ? r['phone_number'].replace(/[^0-9]/g,'') : '';
    if (phone.length === 10) phone = '93'+phone;
    if (phone.length === 11 && phone.startsWith('0')) phone = '93'+phone.slice(1);
    if (phone.length === 12 && phone.startsWith('93')) phone = phone;
    const wa_link = phone ? `https://wa.me/${phone}` : null;

    const tr = document.createElement('tr');
    headers.forEach(h => {
      const key = h.toLowerCase().replace(/ /g,'_');
      const td = document.createElement('td');
      if (key === 'phone_number' && r[key]) {
        td.innerHTML = `<span style="color:#25d366;font-weight:bold;cursor:pointer;" onclick="window.open('${wa_link}','_blank')">${r[key]}</span>`;
      } else {
        td.textContent = r[key] !== undefined ? r[key] : '';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  el.appendChild(tbody);
}

// Show/hide custom date range inputs
document.getElementById('period').addEventListener('change', function() {
  document.getElementById('custom-range').style.display =
    this.value === 'custom' ? 'inline-block' : 'none';
});

async function loadData() {
  const period = document.getElementById('period').value;
  let url = '../api/customer-data/?period='+period;
  const limit = document.getElementById('limit').value || 20;
  url += '&limit=' + encodeURIComponent(limit);
  if (period === 'custom') {
    const start = document.getElementById('start_date').value;
    const end = document.getElementById('end_date').value;
    if (start && end) {
      url += '&start_date=' + start + '&end_date=' + end;
    }
  }
  const resp = await fetch(url);
  if (!resp.ok) { alert('Failed to load data'); return; }
  const data = await resp.json();
  renderTable('customers', data.customers || [], ['user_id','name','phone_number','total_orders','delivered_orders','cancelled_orders','total_spent','last_order','loyalty_score']);
  renderTable('top_processed', data.top_processed || [], ['user_id','name','phone_number','total_orders','delivered_orders','cancelled_orders','total_spent']);
  renderTable('top_customers', data.top_customers || [], ['user_id','name','phone_number','total_orders','delivered_orders','cancelled_orders','total_spent']);
  renderTable('top_cancelled', data.top_cancelled || [], ['user_id','name','phone_number','total_orders','delivered_orders','cancelled_orders','total_spent']);
  // No default open table
  ['customers','top_processed','top_customers','top_cancelled'].forEach(function(id){
    document.getElementById(id+'_wrapper').style.display = 'none';
    document.querySelector('#'+id+'_section .collapse-btn').classList.remove('collapsed');
  });
}

document.getElementById('refresh').addEventListener('click', loadData);
window.addEventListener('load', loadData);
</script>
{% endblock %}
