<head>
    <meta charset="UTF-8">
    <title>Popup Input</title>
    <style>
        #popup {
            display: none;
            position: fixed;
            top: 30%;
            left: 40%;
            padding: 20px;
            background: white;
            border: 2px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9998;
        }
    </style>
</head>

<body>
    <h1>vendor page</h1>
    <!--js -->
    <script>
        function showPopup() {
            document.getElementById('popup').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
        // connecting to vendor channel socket 
        //const token_only = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzU5MzEzMTY4LCJpYXQiOjE3NDg5NDUxNjgsImp0aSI6IjZjMGRjYTQyOTljMDQ1OTg4YTU4MDhlMjcyZmVjZTI4IiwidXNlcl9pZCI6NSwicm9sZSI6MX0.DG6Qk9UQEx0yyVtLmdOgHZF4Bst16twc7e0ufLjDHgQ" // take out of localstorage
        //const domain = "http://127.0.0.1:8000"
        //const ws_domain = "ws://127.0.0.1:8000/ws" // use general one
        const domain = "https://www.eatee.food"
        const ws_domain = "wss://www.eatee.food/ws" // use general one
        const token_only = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzYwODgyNzQxLCJpYXQiOjE3NTA1MTQ3NDEsImp0aSI6IjE4YmY3OTg0YTg4YTRmYzRhYThmOWI2M2UzZGYxMWFiIiwidXNlcl9pZCI6NSwicm9sZSI6MX0.mLtnEC3-7_oes5orqMgJw1JoH_U0T7NyFKs2Oiy5dfY" // take out of localstorage 


        const vendor_token = "Bearer " + token_only
        const vendor_id = 2 // take out of localstorage
        const url = ws_domain + `/notf/vdor/${vendor_id}/?token=${token_only}`
        const vendorChannelSocket = new WebSocket(url)
        // reloading whole page after internet disconnection
        window.addEventListener("offline", (e) => {
            console.log("reloading...")
            window.location.reload()
        })
        vendorChannelSocket.onopen = (e) => {
            console.log("connected vendor socket")
        }
        // vendor channel receives message
        vendorChannelSocket.onmessage = async (e) => {
            // recieves notification data of new order, customer final answer, order being carried/delivered
            var data = JSON.parse(e['data'])
            console.log("recived data", data)
            if (data["type"] == "recv_notf") {

                const notf_type = data["notf_type"]
                if (notf_type == "new_order") {
                    // ----------- message is about new order initializaiton, creating pop up
                    const boolValue = document.getElementById('boolInput').value === "true";
                    const sendBtn = document.getElementById("sendBtn")
                    showPopup()
                    const customerId = data['data']['user']
                    // ---------- requesting estimation time for new order
                    const esimateOrderTimeUrl = domain + "/api/vendor/estimate-order-time/?order_id=" + data['data']['id']
                    const headersTimeEstimate = new Headers()
                    headersTimeEstimate.append("Authorization", vendor_token)
                    headersTimeEstimate.append("Content-Type", "application/json")
                    const optionsTimeEstimate = {
                        method: "GET",
                        headers: headersTimeEstimate,
                        redirect: "follow"
                    };
                    fetch(esimateOrderTimeUrl, optionsTimeEstimate).then((response) => response.json()).then(
                        result => {
                            console.log("order time estimate", result, result["estimated"])
                            // the vendor interface should put the result of estimation on pop up
                            // code here...
                        }
                    )
                    // vendor has filled its answer and clicks 'send answer'
                    sendBtn.onclick = (event) => {
                        // preparingMinutes input value to integer
                        const preparingMinutes = parseInt(document.getElementById('minutesInput').value);
                        if (isNaN(preparingMinutes)) {
                            alert("Please enter a valid integer.");
                            return;
                        }
                        // data being sent as vendor's answer, it should include estimation
                        data = {
                            booleanValue: boolValue,
                            integerValue: preparingMinutes, // preparing/cooking time 
                            order_id: data['data']['id']
                            // include delivery estimation here...
                        };
                        // connecting to customer channel and sending vendor answer 
                        const customerChannelUrl = ws_domain + `/notf/cstmr/${customerId}/?token=${token_only}`
                        const customerChannelSocket = new WebSocket(customerChannelUrl)
                        // console.log(data, "answer of vendor")
                        customerChannelSocket.onopen = (e) => {
                            customerChannelSocket.send(JSON.stringify({ "type": "share_notf", "notf_type": "vendor_answer", "data": data }))
                            // clearing pop up elements and waiting for response
                            // code here.....
                        }
                    }
                }

                // ----------- message is about answer of customer, showing answer to vendor
                else if (notf_type == "customer_answer") {
                    const answer = data['data']['answer']
                    console.log(data['data']['answer'], ":answer of customer")
                    // ------------------------ setting order as accepted/rejected and preparing
                    const orderId = data['data']['order_id']
                    let payload = JSON.stringify({
                        "id": orderId,
                        "accepted": false
                    })
                    if (answer == true) {
                        payload = JSON.stringify({
                            "order_id": orderId,
                            "accepted": true
                        })
                    }
                    const acceptOrderHeaders = new Headers()
                    acceptOrderHeaders.append("Authorization", vendor_token)
                    acceptOrderHeaders.append("Content-Type", "application/json")
                    const acceptOrderOptions = {
                        method: "POST",
                        headers: acceptOrderHeaders,
                        body: payload,
                        redirect: "follow"
                    };
                    const acceptOrderUrl = domain + "/api/vendor/ar-order/"
                    // setting order in preparing state after both-sides acceptance
                    fetch(acceptOrderUrl, acceptOrderOptions)
                        .then((response) => response.text())
                        .then((result) => {
                            console.log(result, "result of order set as a/r")

                            /* 
                                close pop up, code here.....
                            */
                            // -------------------------- setting order as carrying 
                            if (answer == true) {
                                const setCarryingUrl = domain + "/api/carrier/set-order-state-carrying/";
                                const carrier_id = 14 // should be choosen by vendor 
                                let headers = new Headers();
                                headers.append("Content-Type", "application/json")
                                headers.append("Authorization", vendor_token);
                                const requestOptions = {
                                    method: "POST",
                                    headers: headers,
                                    body: JSON.stringify({ "order_id": orderId, "carrier_id": carrier_id }),
                                    redirect: "follow"
                                };
                                fetch(setCarryingUrl, requestOptions)
                                    .then((response) => {
                                        console.log("Status code:", response.status); // 👉 Get the status code
                                        return response.json().then(data => ({
                                            status: response.status,
                                            body: data
                                        }));
                                    })
                                    .then(({ status, body }) => {
                                        if (status == 403) {
                                            console.log("not allowed", body)
                                        }
                                        else if (status == 201) {
                                            const customer_id = 7 // this is set when vendor chooses and order to set as carrying using order.user
                                            const customer_ws_url = ws_domain + `/notf/cstmr/${customer_id}/?token=${token_only}`
                                            console.log(customer_ws_url, "custmer channel url")
                                            const customerChannelSocket = new WebSocket(customer_ws_url)
                                            customerChannelSocket.onopen = (e) => {
                                                customerChannelSocket.send(JSON.stringify({ "type": "share_notf", "notf_id": body['notf_id'], 'notf_type': "order_carrying", "data": "null" }))
                                                console.log("notification of carrying state sent to customer")
                                                console.log(body, "result of set carrying state")
                                            }
                                        }
                                        else {
                                            console.log("unkown server error")
                                        }
                                    }
                                    )
                            }
                        })
                }
                else if (notf_type == "order_delivered") {
                    // message is about order delivered successfully
                    console.log(data)
                    const customer_name = data['data']['customer_name']
                    console.log("order delivered successfully to ", customer_name)
                }
                else if (notf_type == "location_data") {
                    // message is about live location data of the carrier

                    console.log("location data", data['data'])
                }
            }


        }
    </script>
    <!--html-->
    <div id="overlay"></div>

    <div id="popup">
        <label>Boolean (true/false):
            <select id="boolInput">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </label>
        <br><br>
        <label>Integer:
            <input type="number" id="minutesInput" required>
        </label>
        <br><br>
        <button id="cancelBtn">Cancel</button>
        <button id="sendBtn">Send</button>

    </div>


</body>
