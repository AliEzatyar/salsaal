{% extends 'base/base.html' %}

{% block body %}
  <!-- Main Wrapper -->
  <div class="wrapper">
    <!-- Main Section Start -->
    <div class="main-section">
      <!-- Cover Image Section End -->
      <div class="page-section account-header buyer-logged-in" style="padding-top: 0;">
        <div class="container">
          <div class="d-flex justify-content-center">
            <div class="col-lg-9 col-md-9 col-sm-12 col-xs-12">
              <div class="user-dashboard loader-holder">
                <div class="user-holder">
                  <h2 class="text-center">Rate {{ vendor.vendor_name }}</h2>
                  <hr />
                  <button class="btn btn-info" onclick="history.back()">Back</button>
                  <hr />
                  <form action="{% url 'vendor:rate_vendor' vendor.id %}" method="post">
                    <div class="form-fields-set">
                      {{ form.as_p }}
                      <div class="field-holder">
                        <div class="">
                          <input class="btn btn-primary w-100" type="submit" value="Submit Ratings" />
                        </div>
                      </div>
                    </div>
                    {% csrf_token %}
                  </form>

                  <!-- My Restaurants Form End -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Main Section End -->
  </div>
{% endblock %}
