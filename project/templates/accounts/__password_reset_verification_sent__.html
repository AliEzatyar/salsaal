{% extends "base/base.html" %}
{%block body%}
<div class="main-section">
    <div class="page-section nopadding cs-nomargin" style="margin-top: 0px;padding-top: 30px;padding-bottom: 60px;margin-bottom: 0px;">
      <div class="container">
        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="user-dashboard loader-holder" style="width: 70%;">
              <div class="user-holder">
                <h4 class="text-center" style="margin-bottom: 0;">Email sent, follow the guidance to reset your password</h4>
                <hr />
                <div id="restaurant-sets-holder">
                  <form class="form-fields-set foodbakery-dev-restaurant-form" method="post" action="{% url 'accounts:forgot_password' %}">
                    <div class="row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="row">
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <div class="payment-holder">
                                <h5>Didn't receive email? <a style="all: unset;" href="{%url 'accounts:forgot_password'%}"> Resend it</a></h5>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    {% csrf_token %}
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{%endblock%}
