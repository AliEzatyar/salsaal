{% extends 'base/base.html' %}

{% block body %}
  <div class="main-section">
    <div class="page-section nopadding cs-nomargin" style="margin-top: 0px;padding-top: 30px;padding-bottom: 60px;margin-bottom: 0px;">
      <div class="container">
        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="user-dashboard loader-holder" style="width: 70%;">
              <div class="user-holder">
                <h4 class="text-center" style="margin-bottom: 0;">Reset Password</h4>
                <hr />
                <div id="restaurant-sets-holder">
                  <form class="form-fields-set foodbakery-dev-restaurant-form" method="post" action="{% url 'accounts:reset_password' %}">
                    <div class="row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div class="row">
                          {% if error %}
                            <span class="mb-0" style="color: red;">{{ error }}</span>
                          {% endif %}
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <label>New Password</label>
                              <input required type="password" name="password" placeholder="Your New Password" />
                            </div>
                          </div>
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <label>New Password Confirm</label>
                              <input required type="password" name="password_confirm" placeholder="Your New Password Confirm" />
                            </div>
                          </div>
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="field-holder">
                              <div class="payment-holder">
                                <input type="submit" name="submit" value="Save" id="btn-next-restaurant-information white" class="bgcolor" />
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    {% csrf_token %}
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
