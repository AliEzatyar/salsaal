{% extends 'base/base.html' %}
{% block body %}
  <div class="breadcrumb mb-0 py-26 bg-main-two-50">
    <div class="container container-lg">
      <div class="breadcrumb-wrapper flex-between flex-wrap gap-16">
        <h6 class="mb-0">حساب من</h6>
        <ul class="flex items-center gap-8 flex-wrap">
          <li class="text-sm">
            <a href="index.html" class="text-gray-900 flex items-center gap-8 hover-text-main-two-600"><i class="ph ph-house"></i> Home</a>
          </li>
          <li class="flex items-center">
            <i class="ph ph-caret-right"></i>
          </li>
          <li class="text-sm text-main-two-600">حساب</li>
        </ul>
      </div>
    </div>
  </div>
  <section class="account py-80">
    <div class="container container-lg">
      <div class="row g-4">
        <form action="{% url 'accounts:forgot_password' %}" method="post" class="flex justify-center items-center">
          <div class="2xl:w-6/12 flex-grow-0 flex-shrink-0 basis-auto pe-xl-5">
            <div class="border border-gray-100 hover-border-main-600 transition-1 rounded-16 px-24 py-40 h-full">
              <h4 class="mb-32 text-center" style="font-family: gool;">بازنشانی رمز عبور</h4>
              {% if no_email %}
                <p class="mb-8 text-danger-600 text-m font-[600] hover-text-decoration-underline">حساب کاربری با این ایمیل یافت نشد!</p>
              {% endif %}
              <div class="mb-24">
                <label for="email" class="text-neutral-900 text-lg mb-8 font-[500]">ایمیل</label>
                <input class="common-input" name="email" id="email" placeholder="ایمیل شما" />
              </div>
              {% csrf_token %}
              <div class="mx-auto mt-auto">
                <div class="flex items-center gap-48 flex-wrap">
                  <button type="submit" class="btn btn-main py-18 px-40">فرستادن کد بازنشانی</button>
                </div>
              </div>
              <div class="mt-18">
                <a href="{% url 'accounts:login' %}" class="text-primary-600 text-m font-[600] hover-text-decoration-underline">ورود به حساب</a>
              </div>
              <div class="mt-18">
                <a href="{% url 'accounts:reg_user' %}" class="text-primary-600 text-m font-[600] hover-text-decoration-underline">ایجاد حساب</a>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
  
{% endblock %}
