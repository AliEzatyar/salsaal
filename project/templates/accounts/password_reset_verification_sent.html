{% extends 'base/base.html' %}
{% block body %}
  <div class="breadcrumb mb-0 py-26 bg-main-two-50">
    <div class="container container-lg">
      <div class="breadcrumb-wrapper flex-between flex-wrap gap-16">
        <h6 class="mb-0">حساب من</h6>
        <ul class="flex items-center gap-8 flex-wrap">
          <li class="text-sm">
            <a href="index.html" class="text-gray-900 flex items-center gap-8 hover-text-main-two-600"><i class="ph ph-house"></i> Home</a>
          </li>
          <li class="flex items-center">
            <i class="ph ph-caret-right"></i>
          </li>
          <li class="text-sm text-main-two-600">حساب</li>
        </ul>
      </div>
    </div>
  </div>
  <section class="account py-80">
    <div class="container container-lg">
      <div class="row g-4">
        <form action="{% url 'accounts:forgot_password' %}" method="post" class="flex justify-center items-center">
          <div class="2xl:w-6/12 flex-grow-0 flex-shrink-0 basis-auto pe-xl-5">
            <div class="border border-gray-100 hover-border-main-600 transition-1 rounded-16 px-24 py-40 h-full">
              <h4 class="mb-32 text-center" style="font-family: gool;">بازنشانی رمز عبور</h4>
              <h5>لینک بازنشانی رمز عبور به ایمیل شما فرستاده شد؛ لطفا ایمیل تان را چک کنید</h5>
              <h5>ایمیل دریافت نکردید؟ <a class="text-green-700" href="{% url 'accounts:forgot_password' %}">ارسال دوباره</a></h5>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
