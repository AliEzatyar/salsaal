<script id="rate_url">{%url 'marketplace:rate'%}</script>
<div class="mt-32">
  <form id="rate-form" >
    <div class="mb-32">
      <select name="rating"   >
        <option value="1">یک ستاره</option>
        <option value="2">دو ستاره</option>
        <option value="3">سه ستاره</option>
        <option value="4">چار ستاره</option>
        <option value="5">پنج ستاره</option>
      </select>
    </div>
    <div class="mb-32">
      <label for="title" class="text-neutral-600 mb-8">نظر</label>
      <input class="common-input rounded-8" type="text" name="comment" placeholder="نظر خود را بنویسید..." />
    </div>
    <input type="hidden" name="object_id" value="{{ object_id }}" />
    <input type="hidden" name="type" value="{{ type }}" />
    <button type="button" id="submit" class="btn btn-main-two rounded-[50rem] mt-14">پست کردن نظر</button>
  </form>
</div>
