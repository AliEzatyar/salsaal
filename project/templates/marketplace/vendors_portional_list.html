{% for vendor in vendors %}
  <div class="vendors-two-item rounded-12 overflow-hidden bg-color-three border border-neutral-50 hover-border-main-two-600 transition-2">
    <div class="vendors-two-item__top bg-overlay style-two relative">
      <div class="vendors-two-item__thumbs h-210">
        <img src="{{ vendor.user_profile.cover.url }}" alt="Image" class="cover-img" />
      </div>
      <div class="absolute top-0 inset-inline-start-0 w-full h-full p-24 z-[1] flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <span class="w-80 h-80 flex items-center justify-center bg-white rounded-[50%] flex-shrink-0"><img src="{{ vendor.user_profile.picture.url }}" alt="Image" /></span><button type="button" class="text-uppercase border border-white px-16 py-8 rounded-[50rem] text-white text-sm hover-bg-main-two-600 hover-text-white hover-border-main-two-600 transition-2">دنبال کردن</button>
        </div>
        <div class="mt-16">
          <h6 class="text-white font-[600] mb-12"><a href="vendor-two-details.html" class="">{{ vendor.vendor_name }}</a></h6>
          <div class="flex items-center gap-6">
            <div class="flex items-center gap-8">
              <span class="text-15 font-[500] text-warning-600 flex"><i class="ph-fill ph-star"></i></span> <span class="text-15 font-[500] text-warning-600 flex"><i class="ph-fill ph-star"></i></span> <span class="text-15 font-[500] text-warning-600 flex"><i class="ph-fill ph-star"></i></span> <span class="text-15 font-[500] text-warning-600 flex"><i class="ph-fill ph-star"></i></span> <span class="text-15 font-[500] text-warning-600 flex"><i class="ph-fill ph-star"></i></span>
            </div><span class="text-xs font-[500] text-white">4.8</span> <span class="text-xs font-[500] text-white">(12K)</span>
          </div>
        </div>
      </div>
    </div>
    <div class="vendors-two-item__content py-4 px-4 flex-grow">
      <div class="flex flex-col gap-14">
        <div class="flex items-center gap-8">
          <span class="flex items-center justify-center text-main-two-600 text-2xl flex-shrink-0"><i class="ph ph-map-pin-line"></i></span>
          <p class="text-sm text-gray-900">{{ vendor.user_profile.get_full_address }}</p>
        </div>
        <div class="flex items-center gap-8">
          <span class="flex items-center justify-center text-main-two-600 text-2xl flex-shrink-0"><i class="ph ph-envelope-simple"></i></span><a href="mailto:info@watch.com" class="text-sm text-gray-900 hover-text-main-60">{{ vendor.user.email }}</a>
        </div>
        <div class="flex items-center gap-8">
          <span class="flex items-center justify-center text-main-two-600 text-2xl flex-shrink-0"><i class="ph ph-phone"></i></span><a href="tel:0833081888" class="text-sm text-gray-900 hover-text-main-60">{{ vendor.user_profile.phone_number }}</a>
        </div>
      </div><a href="{% url 'vendor:vendor_details' vendor.vendor_name %}" class="btn bg-neutral-600 hover-bg-neutral-700 text-white py-12 px-24 rounded-8 flex items-center justify-center gap-8 font-[500] mt-24">مشاهده جزيیات فروشنده<span class="text-xl flex text-main-two-600"><i class="ph ph-storefront"></i></span></a>
    </div>
  </div>
{% endfor %}
