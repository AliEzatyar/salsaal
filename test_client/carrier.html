<script>
    const token_only = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzYxMDQ2NzAyLCJpYXQiOjE3NTA2Nzg3MDIsImp0aSI6IjhjNTZhMWQyNTM2MTRkOTQ4NWVhODAxMDdjMTRhNGJlIiwidXNlcl9pZCI6NDYsInJvbGUiOjN9.vUxdhDIn8ADnhSdBuxVTCRqCFLQRbQG45xijO_12Eb0" // take out of localstorage
    const carrier_token = "Bearer " + token_only
    const vendor_id = 2 // every carrier should have its vendor id
    const domain = "http://127.0.0.1:8000"
    const ws_domain = "ws://127.0.0.1:8000/ws" // use general one
    // rest.ahmadyar.pro
    // const token_only = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzYwODg4NDY5LCJpYXQiOjE3NTA1MjA0NjksImp0aSI6IjI5M2IyNGQ1ODU5ZTQ5OGRiMjY0MzI4ZGI5YjBlYWNlIiwidXNlcl9pZCI6NDYsInJvbGUiOjN9.7JoOtS9nmYDXxCjQGg39StVavyS6-mPL2MXeWJCoeoY"
    // const domain = "https://rest.ahmadyar.pro"
    // const ws_domain = "wss://rest.ahmadyar.pro/ws" // use general one
    
    
    // ----------------------------------------- getting current order of carrier if exists
    const current_order_url = domain + "/api/carrier/my-order/"
    let headers = new Headers();
    headers.append("Content-Type", "application/json")
    headers.append("Authorization", carrier_token);
    let requestOptions = {
        method: "GET",
        headers: headers,
        redirect: "follow"
    };
    // sending the request
    fetch(current_order_url, requestOptions).then((response) => {
        console.log("Status code:", response.status); // 👉 Get the status code
        return response.json().then(data => ({
            status: response.status,
            body: data
        }));
    }).then(result => {
        console.log("carrier's current order", result)
        if (result.status == 404) {
            console.log("not found any order for carrier")
        }
        else if (result.status == 200) {

            //-------------------- current order data is fetched, connecting to channels of customer and vendor 
            const vendor_id = result.body["order"]["vendor"]
            const vendor_ws_url = ws_domain + `/notf/vdor/${vendor_id}/?token=${token_only}`
            const customer_id = result.body["order"]["user"]
            const customer_ws_url = ws_domain + `/notf/cstmr/${customer_id}/?token=${token_only}`
            let vendorChannelSocket = new WebSocket(vendor_ws_url)
            let customerChannelSocket = new WebSocket(customer_ws_url)
            if (vendorChannelSocket.readyState != WebSocket.OPEN) {
                vendorChannelSocket = new WebSocket(vendor_ws_url)
            }
            if (customerChannelSocket.readyState != WebSocket.OPEN) {
                customerChannelSocket = new WebSocket(customer_ws_url)
            }
            let startBtn = document.createElement("button")
            // setting onClick listener and setting location watching and sending function to it.
            startBtn.innerText = "Start going..."
            startBtn.onclick = () => startTracking(customerChannelSocket, vendorChannelSocket, customer_ws_url, vendor_ws_url)
            document.body.appendChild(startBtn)

        }
        else {
            console.log("not implemented server error")
        }

    })
    /*
        This function watches for location changes and tries to send the location
        data to customer and vendor channels. In every location changes, if any of those
        two channels are not in OPEN status, it tries to reconnect to that channel.
        THis is repeated any time the location changes. 
    */
    function startTracking(customer_socket, vendor_socket, c_url, v_url) {
        // sending live location data
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const location_data = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude
                }
                const data = JSON.stringify({
                    type: "share_notf",
                    notf_type: "location_data",
                    data: location_data
                })

                if (customer_socket.readyState == WebSocket.OPEN) {
                    console.log("cusotmer socket open")
                    customer_socket.send(data)

                }
                else {
                    console.log("retrying connection to customer's socket")
                    customer_socket = new WebSocket(c_url)
                    customer_socket.onopen = (e) => {
                        customer_socket.send(data)
                    }
                }

                if (vendor_socket.readyState == WebSocket.OPEN) {
                    console.log("vendor socket open")
                    vendor_socket.send(data)
                }
                else {
                    console.log("retrying connection to vendor's socket")
                    vendor_socket = new WebSocket(v_url)
                    customer_socket.onopen = (e) => {
                        vendor_socket.send(data)
                    }
                }
                console.log("Location sent:", location_data)
            }, (err) => {
                console.error("Geolocation error:", err)
            })

        }
        else {
            console.log("location access denied")
        }
    }



</script>
