    const client_token = "Bearer " + only_token
    const customer_id = 7
    // connecting to customer's channel 
    const url = wbs_domain + `/notf/cstmr/${customer_id}/?token=${only_token}`
    var vendorChannelSocket;
    const customerChannelSocket = new WebSocket(url)
    // reloading whole page after internet disconnection
    window.addEventListener("offline", (e) => {
        console.log("reloading...")
        window.location.reload()
    })
    customerChannelSocket.onopen = (e) => {
        console.log("customer  Socket Open")
        // cancel order
        const cancelUrl = domain + "/api/order/user-orders/cancel/"
        const cancelHeaders = new Headers();
        cancelHeaders.append("Authorization", client_token);
        cancelHeaders.append("Content-Type", "application/json")
        const cancelOptions = {
            method: "DELETE",
            headers: cancelHeaders,
            redirect: "follow"
        };

        fetch(cancelUrl, cancelOptions)
            .then((response) => response.text())
            .then((result) => {
                console.log(result, "result of cancellation")
                // add to cart
                const addToCartUrl = domain + "/api/cart/"
                const addToCartHeaders = new Headers();
                addToCartHeaders.append("Authorization", client_token)
                const raw = "{\"id\":7,\"quantity\":4}";
                addToCartHeaders.append("Content-Type", "application/json")


                const addToCartRequestOptions = {
                    method: "POST",
                    headers: addToCartHeaders,
                    body: raw,
                    redirect: "follow"
                };

                    .then((response) => response.text())

                    })

    // 3 sending answer of customer
    customerChannelSocket.onmessage = async (e) => {
        const data = JSON.parse(e['data'])
        console.log(data, "data came to customer")
        if (data['type'] == "recv_notf") {
            const notf_type = data["notf_type"]
            if (notf_type == "vendor_answer") {
                console.log(data['data'], ":intial answer of vendor")
                vendorChannelSocket.send(JSON.stringify({
                    "type": "share_notf", "notf_type": "customer_answer",
                    "data": { "answer": true, "order_id": data['data']['order_id'] }
                }))
                console.log("anaswer sent back to vendor", { "answer": true, "order_id": data['data']['order_id'] })
            }
            else if (notf_type == "order_carrying") {

                // ------------------------ setting order as delivered

                const headers = new Headers();
                headers.append("Content-Type", "application/json")
                headers.append("Authorization", client_token);
                const requestOptions = {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify({
                        "order_id": 179,
                        "otp": otp
                    }),
                    redirect: "follow"
                };

                fetch(setDeliveredUrl, requestOptions)
                    .then((response) => {
                        console.log("Status code:", response.status); // 👉 Get the status code
                        // Optional: if you still want to parse JSON body
                        return response.json().then(data => ({
                            status: response.status,
                            data: data
                        }));
                    })
                    .then(({ status, data }) => {
                        console.log(data, "data -body")
                        if (status == 403) {
                            console.log("not allowed")
                        }

                        else if (status == 202) {
                            console.log("order set as delivered", data)

                            vendorChannelSocket.send(JSON.stringify({
                                "type": "share_notf", "notf_type": "order_delivered",
                                "data": { "customer_name": data['customer_name'] }
                            }))

                            console.log("Notification of delivered status sent to vendor")
                        }
                        else if (status == 400) {
                            console.log("something is missing")
                        }
                        else {
                            console.log("uknown error")
                        }
                    })
            }
            else if (notf_type == "location_data") {
                console.log(data['data'], "location data comming")
            }
        }
