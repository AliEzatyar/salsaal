</div>

<div class="card">

    const client_token = "Bearer " + only_token
    const vendor_id = 2
    const vendor_token = "Bearer " + only_token
    function renderOrder(order, orderContainer) {
        document.getElementById("prep").style.display = "block";
        console.log("pre time should have been shown now... ")
        const parts = [];
        parts.push(`<div><strong>Preparation time:</strong> ${order.prepTime} minute(s)</div>`);
        parts.push(`<div><strong>Customer:</strong> ${order.user || '<span class="muted">(not provided)</span>'}</div>`);


        if (order.foods && order.foods.length) {
            parts.push('<div><strong>Foods:</strong><ul>' + order.items.map(f => `<li>${escapeHtml(f)}</li>`).join('') + '</ul></div>');
        } else {
            parts.push('<div><strong>Foods:</strong> <span class="muted">none</span></div>');
        }


        if (order.drinks && order.drinks.length) {
            parts.push('<div><strong>Drinks:</strong><ul>' + order.drinks.map(d => `<li>${escapeHtml(d)}</li>`).join('') + '</ul></div>');
        } else {
            parts.push('<div><strong>Drinks:</strong> <span class="muted">none</span></div>');
        }


        orderContainer.innerHTML = parts.join('\n');
    }


    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": "&#39;" }[c];
        });
    }
    // logging connection
    // creating an order
    ws.onopen = (e) => {
        console.log("vendor room connection successfull");
        if (ws.readyState) {
            const data = { vendorId: vendor_id }
            ws.send(JSON.stringify({ type: "SUBSCRIBE_VENDOR", data }))
            console.log("subscribed to vendor room")
        }
    }

    // handling messages
    ws.onmessage = (e) => {
        console.log("message came to vendor", e)
        const message_data = JSON.parse(e.data)
        const message_type = message_data.type;
        if (message_type == "ORDER_DIALOG") { // order communication between vendor and customer
            console.log("order DIALOG message to vendor", message_data)
            const final = message_data.data.final
            const orderId = message_data.data.orderId
            console.log(final)

            document.getElementById("carrying").style.display = "block"
            document.getElementById("setCarrying").onclick = (e) => {
                // setting order as carrying state
                const setOrderCarryingUrl = domain + "/api/vendor/set-order-state-carrying/"
                const headersOrderCarrying = new Headers()
                headersOrderCarrying.append("Authorization", vendor_token)
                headersOrderCarrying.append("Content-Type", "application/json")
                const optionsOrderCarrying = {
                    method: "POST",
                    headers: headersOrderCarrying,
                    body: JSON.stringify({ carrier_id: 14, order_id: orderId }),
                    redirect: "follow"
                };
                fetch(setOrderCarryingUrl, optionsOrderCarrying).then((response) => {
                    response.text()
                }).then(
                    result => {
                        console.log(result, "result of set as carrying....")
                        if (ws.readyState) {
                            const data = { carrierId: 14 }
                            console.log("subscribing data before sending")
                            ws.send(JSON.stringify({ type: "SUBSCRIBE_CARRIER", data }))
                            console.log("subscribed to carrier's  room")
                        }
                    })
            }

        }
        else if (message_type == "CARRIER_LOCATION") {
            console.log("location data received ", message_data.data)
        }
        else if (message_type == "NEW_ORDER") {
            console.log("new order has been created",)
            const new_order_data = message_data.data.data;
            console.log("new order data", new_order_data)
            // subscrigin to order room for further communicaiton
            const data = { orderId: new_order_data.id, subscriber: vendor_id }
            ws.send(JSON.stringify({ type: "SUBSCRIBE_ORDER", data }))

            // rendering order details
            const orderContainer = document.getElementById('orderContainer');

            // Render on load
            renderOrder(new_order_data, orderContainer);

            //--------------------  calculating order reach time
            const esimateOrderTimeUrl = domain + "/api/vendor/estimate-order-time/?order_id=" + new_order_data.id
            const headersTimeEstimate = new Headers()
            headersTimeEstimate.append("Authorization", vendor_token)
            headersTimeEstimate.append("Content-Type", "application/json")
            const optionsTimeEstimate = {
                method: "GET",
                headers: headersTimeEstimate,
                redirect: "follow"
            };
            fetch(esimateOrderTimeUrl, optionsTimeEstimate).then((response) => response.json()).then(
                result => {
                    console.log("order time estimate", result, result["estimated"])
                    console.log("send btn clicked")
                    const delivery_cost = result["delivery_cost"]
                    const delivery_time_estimate = result["estimated"]
                    const order_total_price = Number(new_order_data.total_price)
                    const total_cost = delivery_cost + order_total_price
                    const prepTime = result["preparation_time"]
                    const total_time = delivery_time_estimate + prepTime
                    setTimeout((e) => {

                        ws.send(JSON.stringify({
                            type: "VENDOR_ACCEPTED", data: {
                                orderId: new_order_data.id,
                                "preparation_time": prepTime,
                                "estimation": delivery_time_estimate,
                                "order_cost": order_total_price,
                                "delivery_cost": delivery_cost,
                                "total_cost": total_cost,
                                "total_time": total_time
                            }
                        }))
                    },0)

                }
            )
        }
        
        else if (message_type == "BUYER_FINALIZED"){
            return
        }
    }
